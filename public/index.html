<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../src/web.mjs"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Project Days Calendar</title>
</head>

<body>

    <main>

        <header class="page-header">
            <h1>Days Calendar</h1>
        </header>

        <section>

            <form class="jump-to-date">

                <div>
                    <label for="month-dropdown">Month</label>
                    <select id="month-dropdown" required>
                        <option value="" selected disabled>Choose a month</option>
                    </select>
                </div>

                <div>
                    <label for="year-dropdown">Year</label>
                    <select id="year-dropdown" required>
                        <option value="" selected disabled>Choose a year</option>
                    </select>
                </div>

                <button type="submit" class="submitBtn">Go</button>
            </form>

            <div class="calendar">

                <div class="calendar-header">
                    <button class="prev-month">Previous</button>
                    <h2 id="month-year"></h2>
                    <button class="next-month">Next</button>
                </div>

                <div class="calendar-body">
                    <div class="calendar-weekdays">
                        <!-- Name of the weekdays -->
                    </div>
                    <div class="calendar-dates">
                        <!-- Dates to be popullated here -->
                    </div>
                </div>
            </div>
        </section>


    </main>

</body>

</html>
